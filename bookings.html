<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NWG Dashboard</title>
<style>body{font-family:Arial;margin:0;background:#eef2f7}header{background:#003366;color:#fff;padding:14px}.wrap{max-width:950px;margin:auto;padding:12px}.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px}.nav{display:flex;gap:8px;margin-bottom:12px}.nav a{flex:1;text-align:center;background:#fff;border:1px solid #ddd;padding:10px;border-radius:10px;text-decoration:none;color:#003366;font-weight:bold}button{border:0;padding:10px 12px;border-radius:8px;font-weight:bold;color:#fff}button.del{background:#c62828}button.wa{background:#25D366}button.driver{background:#ff6d00}button.refresh{background:#003366;width:100%;padding:12px}.dash{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.dash div{flex:1;min-width:110px;background:#fff;border-radius:12px;padding:12px;text-align:center}.dash b{font-size:22px;color:#003366}.alert24{background:#c62828;color:#fff;border-radius:12px;padding:14px;margin-bottom:12px;font-weight:bold}.card.urgent{border:3px solid #c62828;background:#fff5f5}.meta{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:8px;font-size:12px;color:#334155;margin-top:8px}.meta b{color:#003366}</style></head><body>
<header><h1>NWG DASHBOARD</h1><p>All Agents - All Bookings - With Audit Trail</p></header>
<div class="wrap">
<div class="nav"><a href="index.html">Single</a><a href="rates.html">Rates</a><a href="package.html">Package</a><a href="bookings.html">Bookings</a></div>
<div id="alertBox"></div>
<div class="dash"><div>Total<br><b id="cTotal">0</b></div><div>Today<br><b id="cToday">0</b></div><div style="background:#ffebee">Next 24 Hrs 🔴<br><b id="c24" style="color:#c62828">0</b></div><div>Upcoming<br><b id="cUp">0</b></div></div>
<button class="refresh" onclick="loadBookings()">🔄 REFRESH - CHECK 24H ALERTS</button><br><br>
<div id="list"></div></div>
<script>
var SCRIPT_URL = "PASTE_YOUR_NEW_EXEC_URL_HERE";
function parseDT(d,t){ if(!d) return null; var x=new Date(d+"T"+(t||"00:00")); return isNaN(x)?null:x; }
function hrsLeft(b){ var dt=parseDT(b.date,b.time); if(!dt) return 9999; return (dt-new Date())/(1000*60*60); }
function loadBookings(){
  if(SCRIPT_URL.indexOf("script.google")>-1){ fetch(SCRIPT_URL).then(r=>r.json()).then(show).catch(()=>show(JSON.parse(localStorage.getItem("nwg_bookings")||"[]"))); }
  else show(JSON.parse(localStorage.getItem("nwg_bookings")||"[]"));
}
function show(list){
  list.sort((a,b)=>(parseDT(a.date,a.time)||new Date(9999))-(parseDT(b.date,b.time)||new Date(9999)));
  var today=new Date().toISOString().slice(0,10);
  var c24=list.filter(b=>{var h=hrsLeft(b);return h>=0&&h<=24;});
  document.getElementById("cTotal").innerText=list.length;
  document.getElementById("cToday").innerText=list.filter(b=>b.date==today).length;
  document.getElementById("c24").innerText=c24.length;
  document.getElementById("cUp").innerText=list.filter(b=>hrsLeft(b)>0).length;
  if(c24.length>0){
    document.getElementById("alertBox").innerHTML="<div class='alert24'>🚨 "+c24.length+" BOOKING(S) IN NEXT 24 HOURS<br><small>"+c24.map(b=>"• "+b.pax+" - "+b.date+" "+b.time).join("<br>")+"</small></div>";
    if(!sessionStorage.getItem("a24")){ sessionStorage.setItem("a24","1"); setTimeout(()=>alert("🚨 24H ALERT\n\n"+c24.map(b=>"- "+b.pax+" | "+b.date+" "+b.time).join("\n")),500); }
  } else document.getElementById("alertBox").innerHTML="<div class='card' style='background:#e8f5e9'>✅ No Urgent Booking in next 24 hours</div>";
  if(!list.length){ document.getElementById("list").innerHTML="<div class='card'>No Bookings Yet</div>"; return; }
  document.getElementById("list").innerHTML=list.map((b,i)=>{
    var h=hrsLeft(b); var cls=h>=0&&h<=24?"card urgent":"card";
    return "<div class='"+cls+"'><b>"+b.type+"</b> - <b>"+b.total+" SAR</b> - In "+Math.round(h)+" Hrs<br><br><b>Agent:</b> "+b.agent+" | <b>Pax:</b> "+b.pax+"<br><b>Date:</b> "+b.date+" | <b>Time:</b> "+b.time+"<br><p style='font-size:13px'>"+b.detail+"</p><div class='meta'>🕒 <b>Created At:</b> "+(b.createdAt||b.created||"-")+"<br>✏️ <b>Modified At:</b> "+(b.modifiedAt||b.createdAt||"-")+"<br>👤 <b>Created By:</b> "+(b.createdBy||b.agent||"-")+"<br>🔄 <b>Modified By:</b> "+(b.modifiedBy||b.createdBy||"-")+"</div><br><button class='driver' onclick='remind("+i+")'>🚨 REMIND DRIVER</button> <button class='wa' onclick='share("+i+")'>📲 WhatsApp</button></div>";
  }).join(""); window._list=list;
}
function share(i){ var b=window._list[i]; window.open("https://wa.me/?text="+encodeURIComponent("NWG "+b.type+" - "+b.detail+" FINAL: "+b.total+" SAR"),"_blank"); }
function remind(i){ var b=window._list[i]; window.open("https://wa.me/?text="+encodeURIComponent("🚨 URGENT - Pickup in 24H\nPax: "+b.pax+"\nDate: "+b.date+" "+b.time+"\nDetail: "+b.detail+"\nTotal: "+b.total+" SAR\nCreated By: "+b.createdBy+"\nPlease confirm driver NOW"),"_blank"); }
loadBookings(); setInterval(loadBookings,60000);
</script></body></html>
