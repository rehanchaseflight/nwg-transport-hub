<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NWG Transport Hub</title>
<style>body{font-family:Arial;margin:0;background:#eef2f7}header{background:#003366;color:#fff;padding:14px}.wrap{max-width:900px;margin:auto;padding:12px}.card{background:#fff;border-radius:12px;padding:14px}input,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;margin:4px 0 10px}button{border:0;padding:12px;background:#0a7a2e;color:#fff;border-radius:9px;font-weight:bold}button.wa{background:#25D366;margin-top:8px}.curr{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.curr div{flex:1;min-width:110px;background:#f0f7ff;border:1px solid #cfe0ff;border-radius:10px;padding:10px;text-align:center}.curr b{color:#003366}.nav{display:flex;gap:8px;margin-bottom:12px}.nav a{flex:1;text-align:center;background:#fff;border:1px solid #ddd;padding:10px;border-radius:10px;text-decoration:none;color:#003366;font-weight:bold}</style></head><body>
<header><h1>NWG TRANSPORT HUB</h1><p>New World Group • Season 1447/48</p></header>
<div class="wrap">
<div class="nav"><a href="index.html">Single</a><a href="rates.html">Rates</a><a href="package.html">Package</a><a href="bookings.html">Bookings</a></div>
<div class="card"><h2>Single Booking</h2>
<label>Agent Name</label><input id="agent" placeholder="Enter Agent Name">
<label>Pax / Leader Name</label><input id="pax" placeholder="Enter Pax Name">
<label>Hotel Name - Type Any Hotel</label><input id="hotel" placeholder="e.g. Pullman Zamzam, Al Mauqam, Hilton, Swissotel">
<label>Destination / Route</label><select id="route">
<option value="190">JED APT - MAK HOTEL - 190</option>
<option value="180">MAK HOTEL - JED APT - 180</option>
<option value="360">MAK HOTEL - MED HOTEL - 360</option>
<option value="385">JED APT - MED HOTEL - 385</option>
<option value="130">MED HOTEL - MED HOTEL - 130</option>
<option value="125">MED HOTEL - MED APT - 125</option>
<option value="190">MAKKAH ZIYARAT - 190</option>
<option value="190">MADINA ZIYARAT - 190</option>
<option value="400">MAK HOTEL - TAIF ZIYARAT - 400</option>
<option value="475">MAK TO MED (VIA BADAR) - 475</option>
</select>
<label>Vehicle</label><select id="veh"><option>Car</option><option>Hi-Staria</option><option>GMC</option><option>Hiace</option><option>Coaster</option></select>
<label><input type="checkbox" id="tower" style="width:auto"> Tick ONLY if Hotel is Pullman Zamzam / Makkah Tower +30 SAR</label><br><br>
<button onclick="calc()">CALCULATE TOTAL</button>
<h2 id="r">Total: 0 SAR</h2>
<div class="curr" id="curr"></div>
<p id="detail" style="font-size:13px;color:#333"></p>
<button class="wa" onclick="shareWA()">📲 SHARE ON WHATSAPP</button>
</div></div>
<script>
var lastMsg="";
function calc(){
var base=parseInt(document.getElementById("route").value);
var ex=document.getElementById("tower").checked?30:0;
var t=base+ex; var m=Math.round(t*0.10); var f=t+m;
document.getElementById("r").innerText="Base: "+t+" + Markup: "+m+" = FINAL: "+f+" SAR";
var rates={USD:0.2667,PKR:73.77,CAD:0.3801,GBP:0.2014,EUR:0.2409};
var h="";for(var c in rates){h+="<div>"+c+"<br><b>"+(f*rates[c]).toLocaleString(undefined,{maximumFractionDigits:2})+" "+c+"</b></div>";}
document.getElementById("curr").innerHTML=h;
var det="Agent: "+document.getElementById("agent").value+" | Pax: "+document.getElementById("pax").value+" | Hotel: "+document.getElementById("hotel").value+" | Vehicle: "+document.getElementById("veh").value;
document.getElementById("detail").innerText=det;
lastMsg="NWG Transport - Single Booking%0A"+det.replace(/\|/g,"-")+"%0ARoute Base: "+base+" + Extra: "+ex+" + Markup: "+m+"%0A*FINAL: "+f+" SAR*%0AUSD: "+(f*0.2667).toFixed(2)+" | PKR: "+Math.round(f*73.77);
}
function shareWA(){if(!lastMsg){calc();} window.open("https://wa.me/?text="+lastMsg,"_blank");}
</script></body></html>
