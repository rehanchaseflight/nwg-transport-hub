<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NWG Transport Hub</title>
<style>
body{margin:0;font-family:Arial;background:#eef2f7}header{background:#003366;color:#fff;padding:14px}h1{margin:0;font-size:22px}.wrap{max-width:900px;margin:auto;padding:12px}.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px}label{font-size:12px;color:#555}input,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;margin:4px 0 10px}button{border:0;padding:12px 16px;border-radius:9px;font-weight:bold;background:#0a7a2e;color:#fff;cursor:pointer}.row{display:flex;gap:10px}.row>div{flex:1}
</style></head><body>
<header><h1>NWG TRANSPORT HUB</h1><p>New World Group • Season 1447/48</p></header>
<div class="wrap">
<div class="card"><h2>Single Booking</h2>
<div class="row"><div><label>Agent</label><input id="agent" value="Al-Noor"></div><div><label>Pax Name</label><input id="pax" value="Ahmed Khan"></div></div>
<div class="row"><div><label>Destination / Route</label>
<select id="route">
<option value="190">JED APT - MAK HOTEL - Car 190</option>
<option value="180">MAK HOTEL - JED APT - Car 180</option>
<option value="360">MAK HOTEL - MED HOTEL - Car 360</option>
<option value="385">JED APT - MED HOTEL - Car 385</option>
<option value="130">MED HOTEL - MED HOTEL - Car 130</option>
<option value="125">MED HOTEL - MED APT - Car 125</option>
<option value="190">MAKKAH ZIYARAT - Car 190</option>
<option value="190">MADINA ZIYARAT - Car 190</option>
<option value="400">MAK HOTEL - TAIF ZIYARAT - Car 400</option>
<option value="125">MAK HOTEL - MAK RAILWAY - Car 125</option>
<option value="125">MED HOTEL - MED RAILWAY - Car 125</option>
<option value="475">MAK TO MED (VIA BADAR) - Car 475</option>
<option value="150">JED APT - JED CITY - Car 150</option>
<option value="250">WADI JIN + MED ZIYARAT - Car 250</option>
<option value="125">WADI JIN ONLY - Car 125</option>
<option value="550">BADAR + MED ZIYARAT - Car 550</option>
<option value="425">BADAR ONLY - Car 425</option>
<option value="375">TAIF APT - MAK HOTEL - Car 375</option>
<option value="150">JORANA MEEQAT - Car 150</option>
<option value="475">JED TO JOHFA + MEEQAT TO MAK - Car 475</option>
</select>
</div><div><label>Vehicle</label><select id="vehicle"><option>Car</option><option>GMC</option><option>Hiace</option><option>Coaster</option></select></div></div>
<label><input type="checkbox" id="tower"> Pullman Zamzam / Makkah Tower +30 SAR</label><br><br>
<button onclick="calc()">CALCULATE TOTAL</button>
<h2 id="result">Total: 0 SAR</h2><p id="msg"></p>
</div></div>
<script>
function calc(){
var base=parseInt(document.getElementById("route").value);
var extra=document.getElementById("tower").checked?30:0;
var total=base+extra;var markup=Math.round(total*0.10);var fin=total+markup;
document.getElementById("result").innerText="Base: "+base+" + Extra: "+extra+" + Markup: "+markup+" = FINAL: "+fin+" SAR";
document.getElementById("msg").innerText="Agent: "+document.getElementById("agent").value+" | Pax: "+document.getElementById("pax").value;
}
</script></body></html>
