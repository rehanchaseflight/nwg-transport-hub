<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NWG Transport Hub</title>
<style>body{font-family:Arial;margin:0;background:#eef2f7}header{background:#003366;color:#fff;padding:14px}.wrap{max-width:900px;margin:auto;padding:12px}.card{background:#fff;border-radius:12px;padding:14px}input,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;margin:4px 0 10px;box-sizing:border-box}button{border:0;padding:12px;background:#0a7a2e;color:#fff;border-radius:9px;font-weight:bold}button.wa{background:#25D366;margin-top:8px}.curr{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.curr div{flex:1;min-width:110px;background:#f0f7ff;border:1px solid #cfe0ff;border-radius:10px;padding:10px;text-align:center}.curr b{color:#003366}.nav{display:flex;gap:8px;margin-bottom:12px}.nav a{flex:1;text-align:center;background:#fff;border:1px solid #ddd;padding:10px;border-radius:10px;text-decoration:none;color:#003366;font-weight:bold}.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1;background:#003366}.tabs button.off{background:#ddd;color:#333}.row{display:flex;gap:8px}.row>div{flex:1}</style></head><body>
<header><h1>NWG TRANSPORT HUB</h1><p>Single + Full Trip Booking - SAR Base</p></header>
<div class="wrap">
<div class="nav"><a href="index.html">Single</a><a href="rates.html">Rates</a><a href="package.html">Package</a><a href="bookings.html">Bookings</a></div>
<div class="tabs"><button id="b1" onclick="show(1)">Single Trip</button><button id="b2" class="off" onclick="show(2)">Full Trip Booking</button></div>

<!-- SINGLE -->
<div class="card" id="tab1">
<h2>Single Trip</h2>
<label>Agent Name</label><input id="sAgent" placeholder="Enter Agent Name">
<label>Pax / Leader Name</label><input id="sPax" placeholder="Enter Pax Name">
<div class="row"><div><label>Travel Date</label><input id="sDate" type="date"></div><div><label>Pickup Time</label><input id="sTime" type="time"></div></div>
<label>Hotel / Pickup Location</label><input id="sHotel" placeholder="Type Hotel Name">
<label>Route</label><select id="sRoute" onchange="updVehicle()"></select>
<label>Vehicle</label><select id="sVehicle"></select>
<button onclick="calcSingle()">CALCULATE SINGLE</button>
<h2 id="sR">Total: 0 SAR</h2>
<div class="curr" id="sCurr"></div>
<p id="sDetail" style="font-size:13px;color:#333"></p>
<button class="wa" onclick="shareSingle()">📲 SHARE ON WHATSAPP</button>
</div>

<!-- FULL TRIP -->
<div class="card" id="tab2" style="display:none">
<h2>Full Trip Booking</h2>
<label>Agent Name</label><input id="fAgent" placeholder="Enter Agent Name">
<label>Pax / Leader Name</label><input id="fPax" placeholder="Enter Pax Name">
<div class="row"><div><label>Travel Date</label><input id="fDate" type="date"></div><div><label>Pickup Time</label><input id="fTime" type="time"></div></div>
<label>Makkah Hotel</label><input id="hMak" placeholder="Type Makkah Hotel Name">
<label>Medina Hotel</label><input id="hMed" placeholder="Type Medina Hotel Name">
<label>Leg 1 - JED APT to MAK HOTEL</label><select id="l1"><option value="190">Car 190</option><option value="210">Hi-Staria 210</option><option value="385">GMC 385</option><option value="285">Hiace 285</option><option value="520">Coaster 520</option></select>
<label>Leg 2 - MAKKAH ZIYARAT</label><select id="l2"><option value="190">Car 190</option><option value="210">Hi-Staria 210</option><option value="325">GMC 325</option><option value="300">Hiace 300</option><option value="425">Coaster 425</option></select>
<label>Leg 3 - MAK HOTEL to MED HOTEL</label><select id="l3"><option value="360">Car 360</option><option value="400">Hi-Staria 400</option><option value="850">GMC 850</option><option value="510">Hiace 510</option><option value="850">Coaster 850</option></select>
<label>Leg 4 - MADINA ZIYARAT</label><select id="l4"><option value="190">Car 190</option><option value="210">Hi-Staria 210</option><option value="325">GMC 325</option><option value="300">Hiace 300</option><option value="425">Coaster 425</option></select>
<label>Leg 5 - MED HOTEL to MED APT / JED APT</label><select id="l5"><option value="125">MED APT - Car 125</option><option value="150">MED APT - Hi-Staria 150</option><option value="275">MED APT - GMC 275</option><option value="285">MED APT - Hiace 285</option><option value="450">MED APT - Coaster 450</option><option value="180">JED APT - Car 180</option><option value="190">JED APT - Hi-Staria 190</option><option value="350">JED APT - GMC 350</option><option value="270">JED APT - Hiace 270</option><option value="500">JED APT - Coaster 500</option></select>
<label>Vehicle</label><select id="fVehicle"><option>Car</option><option>Hi-Staria</option><option>GMC</option><option>Hiace</option><option>Coaster</option></select>
<button onclick="calcFull()">CALCULATE FULL TRIP</button>
<h2 id="fR">Total: 0 SAR</h2>
<div class="curr" id="fCurr"></div>
<p id="fDetail" style="font-size:13px;color:#333"></p>
<button class="wa" onclick="shareFull()">📲 SHARE ON WHATSAPP</button>
</div>
</div>
<script>
var D=[["JED APT - MAK HOTEL",190,210,385,285,520],["MAK HOTEL - JED APT",180,190,350,270,500],["MAK HOTEL - MED HOTEL",360,400,850,510,850],["JED APT - MED HOTEL",385,415,875,525,850],["MED HOTEL - MED HOTEL",130,155,280,290,450],["MED HOTEL - MED APT",125,150,275,285,450],["MED APT - MED HOTEL",125,150,275,285,450],["MAKKAH ZIYARAT",190,210,325,300,425],["MADINA ZIYARAT",190,210,325,300,425],["MAK HOTEL - TAIF ZIYARAT",400,425,900,525,900],["TAIF - MAK HOTEL (RETURN)",400,425,900,525,900],["MAK TO MED (VIA BADAR)",475,525,950,650,1000],["JED APT - TAIF",450,475,950,550,950],["JED APT - MAK (HAJJ TERMINAL)",280,300,475,375,610],["MAK - JED APT (HAJJ TERMINAL)",270,280,440,360,590]];
var V=["Car","Hi-Staria","GMC","Hiace","Coaster"];
var sr=document.getElementById("sRoute"); sr.innerHTML=D.map((r,i)=>"<option value='"+i+"'>"+r[0]+"</option>").join("");
function updVehicle(){var i=sr.value;var sv=document.getElementById("sVehicle");sv.innerHTML=V.map((v,j)=>"<option value='"+D[i][j+1]+"'>"+v+" "+D[i][j+1]+"</option>").join("");}
updVehicle();
function show(n){document.getElementById("tab1").style.display=n==1?"block":"none";document.getElementById("tab2").style.display=n==2?"block":"none";document.getElementById("b1").className=n==1?"":"off";document.getElementById("b2").className=n==2?"":"off";}
var lastS="",lastF="";
function currBox(el,f){var rates={USD:0.2667,PKR:73.77,CAD:0.3801,GBP:0.2014,EUR:0.2409};var h="";for(var c in rates){h+="<div>"+c+"<br><b>"+(f*rates[c]).toLocaleString(undefined,{maximumFractionDigits:2})+" "+c+"</b></div>";}document.getElementById(el).innerHTML=h;}
function calcSingle(){var base=parseInt(document.getElementById("sVehicle").value);var m=Math.round(base*0.10);var f=base+m;document.getElementById("sR").innerText="Base: "+base+" + Markup: "+m+" = FINAL: "+f+" SAR";currBox("sCurr",f);var det="Agent: "+document.getElementById("sAgent").value+" | Pax: "+document.getElementById("sPax").value+" | Date: "+document.getElementById("sDate").value+" | Time: "+document.getElementById("sTime").value+" | Hotel: "+document.getElementById("sHotel").value+" | Route: "+D[sr.value][0]+" | Vehicle: "+document.getElementById("sVehicle").options[document.getElementById("sVehicle").selectedIndex].text;document.getElementById("sDetail").innerText=det;lastS="NWG Single Trip%0A"+det.replace(/\|/g,"-")+"%0A*FINAL: "+f+" SAR*%0AUSD: "+(f*0.2667).toFixed(2)+" | PKR: "+Math.round(f*73.77);}
function shareSingle(){if(!lastS){calcSingle();}window.open("https://wa.me/?text="+lastS,"_blank");}
function calcFull(){var base=parseInt(document.getElementById("l1").value)+parseInt(document.getElementById("l2").value)+parseInt(document.getElementById("l3").value)+parseInt(document.getElementById("l4").value)+parseInt(document.getElementById("l5").value);var m=Math.round(base*0.10);var f=base+m;document.getElementById("fR").innerText="Base: "+base+" + Markup: "+m+" = FINAL: "+f+" SAR";currBox("fCurr",f);var det="Agent: "+document.getElementById("fAgent").value+" | Pax: "+document.getElementById("fPax").value+" | Date: "+document.getElementById("fDate").value+" | Time: "+document.getElementById("fTime").value+" | Makkah Hotel: "+document.getElementById("hMak").value+" | Medina Hotel: "+document.getElementById("hMed").value+" | Vehicle: "+document.getElementById("fVehicle").value+" | Legs: "+document.getElementById("l1").value+" + "+document.getElementById("l2").value+" + "+document.getElementById("l3").value+" + "+document.getElementById("l4").value+" + "+document.getElementById("l5").value;document.getElementById("fDetail").innerText=det;lastF="NWG Full Trip%0A"+det.replace(/\|/g,"-")+"%0A*FINAL: "+f+" SAR*%0AUSD: "+(f*0.2667).toFixed(2)+" | PKR: "+Math.round(f*73.77);}
function shareFull(){if(!lastF){calcFull();}window.open("https://wa.me/?text="+lastF,"_blank");}
</script></body></html>
